/* ============================================================

   An original sunset driving game in the spirit of the 1986 coin-op: a
   pseudo-3D road that curves and crests, a fork at the end of every stage,

   arranged as a pyramid, five endings. All code and art are my own.

const cv=document.getElementById('c'), X=cv.getContext('2d');
const W=640,H=400,TAU=Math.PI*2;

function safeLS(k,v){
  try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; }
}
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);

}

function detectLang(){
  try{
    const saved=safeLS('costa_lang'); if(saved&&LANGS.includes(saved)) return saved;
    const list=(navigator.languages&&navigator.languages.length)?navigator.languages:[navigator.language||'en'];
    for(const raw of list){ const l=String(raw).slice(0,2).toLowerCase(); if(LANGS.includes(l)) return l; }
  }catch(e){}
  return 'en';
}
let lang=detectLang();
function T(k){ return (STR[lang]&&STR[lang][k]) || STR.en[k] || k; }

/* ---------------- audio: engine, effects and a car radio ---------------- */
let AC=null, muted=(safeLS('costa_mute')==='1');
function ac(){
  if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(AC&&AC.state==='suspended'){ try{ AC.resume(); }catch(e){} }
  return AC;
}
function beep(f,dur,type,vol,slideTo){
  if(muted) return;
  const a=ac(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type||'square'; o.frequency.value=f;
  const t=a.currentTime;
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t+(dur||0.08));
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.05,t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.08));
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+(dur||0.08)+0.02);
}
function noise(dur,vol,lp){
  if(muted) return;
  const a=ac(); if(!a) return;
  const n=Math.floor(a.sampleRate*(dur||0.08));
  const buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(), g=a.createGain();
  s.buffer=buf; g.gain.value=vol||0.06;
  if(lp){ const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=lp; s.connect(f); f.connect(g); }
  else s.connect(g);
  g.connect(a.destination); s.start();
}
/* engine: one oscillator whose pitch follows the speed */
let eng=null, engGain=null;
function engineOn(){
  const a=ac(); if(!a||eng) return;
  try{
    eng=a.createOscillator(); engGain=a.createGain();
    eng.type='sawtooth'; eng.frequency.value=60;
    engGain.gain.value=0.0;
    const f=a.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900;
    eng.connect(f); f.connect(engGain); engGain.connect(a.destination);
    eng.start();
  }catch(e){ eng=null; }
}
function engineSet(rpm,on){
  if(!eng||!engGain) return;
  try{
    eng.frequency.setTargetAtTime(50+rpm*150, AC.currentTime, 0.05);
    engGain.gain.setTargetAtTime(muted||!on?0:0.035, AC.currentTime, 0.08);
  }catch(e){}
}
const sfx={
  skid: ()=>noise(0.18,0.05,1400),
  bump: ()=>{noise(0.16,0.10,600); beep(120,0.18,'square',0.05,60);},
  check:()=>[880,1175,1568].forEach((f,i)=>setTimeout(()=>beep(f,0.14,'square',0.05),i*110)),
  gear: ()=>beep(180,0.06,'square',0.03,320),
  goal: ()=>[523,659,784,1047,1319,1568].forEach((f,i)=>setTimeout(()=>beep(f,0.18,'square',0.05),i*140)),
  fail: ()=>[400,300,200,140].forEach((f,i)=>setTimeout(()=>beep(f,0.26,'sawtooth',0.06),i*150)),
  menu: ()=>beep(620,0.05,'square',0.035)
};

/* --- the radio: three original loops, scheduled a bar at a time --- */
const N={C:261.63,D:293.66,E:329.63,F:349.23,G:392.00,A:440.00,B:493.88,
         c:523.25,d:587.33,e:659.25,f:698.46,g:783.99,a:880.00,b:987.77,x:0};
const TUNES=[
 {name:'SUNSET CRUISE', bpm:118,
  lead:'E G a g E G b a  D F a g D F g f  C E g f C E a g  D F a b c b a g',
  bass:'C C G G  A A E E  F F C C  G G G G'},
 {name:'PALM HIGHWAY', bpm:132,
  lead:'c b a g a b c d  e d c b c d e f  g f e d e f g a  b a g f e d c C',
  bass:'A A A A  F F F F  C C C C  G G G G'},
 {name:'NIGHT FERRY', bpm:104,
  lead:'A c e c A c e g  G B d B G B d f  F A c A F A c e  E G B G E G B d',
  bass:'A A E E  G G D D  F F C C  E E B B'}
];
let radio=0, musicOn=true, musTimer=null, musStep=0, musNext=0;
function startMusic(){
  stopMusic();
  const a=ac(); if(!a) return;
  musStep=0; musNext=a.currentTime+0.05;
  musTimer=setInterval(pumpMusic,60);
}
function stopMusic(){ if(musTimer){ clearInterval(musTimer); musTimer=null; } }
function pumpMusic(){
  const a=AC; if(!a||muted||!musicOn) return;
  const t=TUNES[radio], spb=60/t.bpm/2;           /* eighth notes */
  const lead=t.lead.split(/\s+/).filter(Boolean);
  const bass=t.bass.split(/\s+/).filter(Boolean);
  while(musNext < a.currentTime+0.35){
    const li=musStep%lead.length, bi=Math.floor(musStep/4)%bass.length;
    const lf=N[lead[li]]||0, bf=(N[bass[bi]]||0)/2;
    if(lf) tone(lf,musNext,spb*0.9,'square',0.030);
    if(musStep%4===0 && bf) tone(bf,musNext,spb*3.2,'triangle',0.045);
    if(musStep%2===0) hat(musNext);
    musNext+=spb; musStep++;
  }
}
function tone(f,when,dur,type,vol){
  const a=AC; if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,when);
  g.gain.exponentialRampToValueAtTime(vol,when+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,when+dur);
  o.connect(g); g.connect(a.destination); o.start(when); o.stop(when+dur+0.02);
}
function hat(when){
  const a=AC; if(!a) return;
  const n=Math.floor(a.sampleRate*0.03), buf=a.createBuffer(1,n,a.sampleRate), d=buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=a.createBufferSource(), g=a.createGain(), f=a.createBiquadFilter();
  f.type='highpass'; f.frequency.value=6000;
  s.buffer=buf; g.gain.value=0.02;
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(when);
}
function toggleMute(){
  muted=!muted; safeLS('costa_mute',muted?'1':'0'); syncChrome();
  if(muted){ engineSet(0,false); } else { sfx.menu(); }
}

/* ---------------- the road ---------------- */
const SEG=200, ROADW=2000, LANES=3, DRAW=260, CAMH=1100, FOV=100;
const CAMD=1/Math.tan((FOV/2)*Math.PI/180);
let segs=[];

/* Fifteen stages as a pyramid: 1 at the top, then 2, 3, 4, 5. Index by
   (row, pos) — a fork sends you to pos or pos+1 on the next row. */
const ROWS=5;
const THEMES=[
  {sky:['#ff9a4a','#ffd9a0'], ground:'#c8a060', road:'#6a6a72', rumble:['#e8e8f0','#d04030'],
   name:'COŠTA', props:['palm','sign']},
  {sky:['#5a9adf','#bfe4ff'], ground:'#7ab05a', road:'#66666e', rumble:['#ffffff','#cc3b30'],
   name:'VALLE', props:['tree','sign']},
  {sky:['#2a2a6a','#7a5aa0'], ground:'#3a3a52', road:'#5a5a64', rumble:['#e0e0f0','#c03040'],
   name:'NOČ',  props:['lamp','sign']},
  {sky:['#e8b070','#ffe6c0'], ground:'#d8c890', road:'#70706a', rumble:['#ffffff','#c8442c'],
   name:'DUNE', props:['cactus','sign']},
  {sky:['#8ad0e0','#e8fbff'], ground:'#d8e8f0', road:'#6a7078', rumble:['#ffffff','#3a6ad0'],
   name:'SIERRA',props:['pine','sign']}
];
const GOALS=['MARINA','CASTILLO','LAGUNA','MIRADOR','PUERTO'];

let stageRow=0, stagePos=0, theme=THEMES[0];
let trackLen=0, forkAt=0;

function rnd(s){ return function(){ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; }; }

function buildStage(row,pos){
  theme=THEMES[row%THEMES.length];
  const R=rnd(9001+row*137+pos*31);
  segs=[];
  const hard=0.4+row*0.22;
  let y=0;
  const total=560+row*40;
  forkAt=total-170;
  function push(curve,dy){
    const n=segs.length;
    segs.push({i:n, curve, p1:{world:{y:y,z:n*SEG}}, p2:{world:{y:y+dy,z:(n+1)*SEG}},
               sprites:[], cars:[], fork:0});
    y+=dy;
  }
  function stretch(len,curve,hill){
    for(let i=0;i<len;i++){
      const e=easeInOut(i/len);
      push(curve*e, hill*Math.sin(i/len*Math.PI)*1.2);
    }
  }
  function easeInOut(p){ return p<0.5? 2*p*p : -1+(4-2*p)*p; }

  stretch(40,0,0);
  while(segs.length<forkAt){
    const c=(R()*2-1)*hard*3.2;
    const hillAmp=(R()*2-1)*40*(0.4+row*0.18);
    stretch(28+Math.floor(R()*36), c, hillAmp);
    if(R()<0.35) stretch(20+Math.floor(R()*20),0,0);
  }
  /* the fork: the road splits wider and wider for the last stretch */
  while(segs.length<total){
    const k=(segs.length-forkAt)/(total-forkAt);
    push(0,0);
    segs[segs.length-1].fork=Math.min(1,k*1.5);
  }
  /* the sign board that stands on the nose of the island, so the split is
     announced by the scenery and not only by a line of HUD text */
  if(segs[forkAt]) segs[forkAt].sprites.push({x:0, kind:'split'});
  trackLen=segs.length*SEG;

  /* roadside props and traffic */
  for(let i=30;i<segs.length-30;i++){
    /* while the road is splitting, the verge has moved outwards — planting a
       palm at its old distance would put it in the middle of a lane */
    const push0=segs[i].fork*1.25;
    if(i%9===0){
      const side=(R()<0.5?-1:1);
      segs[i].sprites.push({x:side*(1.35+push0+R()*1.4), kind:theme.props[R()<0.82?0:1]});
    }
    if(i%4===0 && R()<0.25){
      segs[i].sprites.push({x:(R()<0.5?-1:1)*(2.6+push0+R()*2.2), kind:theme.props[0]});
    }
  }
  const traffic=26+row*6;
  for(let i=0;i<traffic;i++){
    const z=(60+R()*(segs.length-160))*SEG;
    const x=(R()*2-1)*0.72;
    cars.push({z, x, br:(x>=0?1:-1), speed:MAXSPD*(0.35+R()*0.35),
               col:CARCOL[Math.floor(R()*CARCOL.length)], brake:0});
  }
}
/* The one definition of what a splitting road looks like, used by the
   renderer, by the off-road test and by the traffic — so what you see and
   what the car collides with can never drift apart.
   Each carriageway narrows and slides outwards; the island opens between
   them once the offset has overtaken the width. */
const FORK_OFF=1.05, FORK_NARROW=0.45;
function forkOff(f){ return f*FORK_OFF; }
function forkHW(f){ return 1-FORK_NARROW*f; }
/* Where a traffic car actually sits once the road has begun to split: it
   commits to one branch instead of floating over the island. */
function carX(c,fk){
  if(!fk) return c.x;
  return c.x*forkHW(fk) + c.br*forkOff(fk);
}
const CARCOL=['#3a6ad0','#d0c040','#40b060','#d06030','#c0c0d0','#a040a0'];

/* ---------------- driving ---------------- */
const MAXSPD=SEG*62;
let cars=[];
let pos=0, playerX=0, speed=0, gearHi=true, offRoad=false;
let timeLeft=80, score=0, distance=0, bumpT=0, skidT=0;
/* crashT drives the whole visible reaction to a hit: shake, spin, smoke and
   a moment of vague steering. dirtT keeps the off-road warning from flashing
   every frame while two wheels are in the sand. */
let crashT=0, crashDir=0, dirtT=0, smoke=[];
let state='title', phaseT=0, perf=0, last=0, msg='', msgT=0, endGoal='';
let hi=parseInt(safeLS('costa_hi')||'0',10)||0;
let localScores=[]; try{ localScores=JSON.parse(safeLS('costa_scores')||'[]')||[]; }catch(e){ localScores=[]; }
let playerName=(safeLS('costa_name')||'').toUpperCase();
let overlayOpen=false, inputLock=0, paused=false;
let forkChoice=0;

function say(t){ msg=t; msgT=2.2; }
/* tyre smoke, drawn over the player car after a hit */
function spawnSmoke(){
  for(let i=0;i<14;i++){
    smoke.push({x:(Math.random()*2-1)*64, y:(Math.random()*2-1)*10,
                vx:(Math.random()*2-1)*70, vy:-20-Math.random()*40,
                r:5+Math.random()*7, t:0.5+Math.random()*0.5, life:1});
  }
}
function startRun(){
  stageRow=0; stagePos=0; score=0; timeLeft=80; distance=0;
  cars=[]; buildStage(0,0);
  pos=0; playerX=0; speed=0; gearHi=false;
  crashT=0; dirtT=0; smoke=[]; bumpT=0; skidT=0;
  state='ready'; phaseT=0;
  engineOn(); startMusic();
}
function nextStage(){
  score+=5000+stageRow*2500+Math.floor(timeLeft)*100;
  if(stageRow>=ROWS-1){
    endGoal=GOALS[clamp(stagePos,0,GOALS.length-1)];
    state='goal'; phaseT=0; sfx.goal(); stopMusic(); engineSet(0,false); submitScore(); return;
  }
  stagePos=clamp(stagePos+forkChoice,0,stageRow+1);
  stageRow++;
  timeLeft+=42+stageRow*4;
  cars=[]; buildStage(stageRow,stagePos);
  pos=0; playerX=0;
  crashT=0; dirtT=0; smoke=[];
  say(T('checkpoint')); sfx.check();
  state='ready'; phaseT=0;
}
function timeUp(){
  state='over'; phaseT=0; sfx.fail(); stopMusic(); engineSet(0,false); submitScore();
}

/* ---------------- input ---------------- */
const K={};
const ctl={left:0,right:0,gas:0,brake:0};
let touchOnly=false;
addEventListener('keydown',e=>{
  if(overlayOpen) return;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space','Enter'].includes(e.code)) e.preventDefault();
  K[e.code]=1; ac();
  if(e.repeat) return;
  hotKey(e);
});
addEventListener('keyup',e=>{ K[e.code]=0; });
addEventListener('blur',()=>{ for(const k in K) K[k]=0; ctl.left=ctl.right=ctl.gas=ctl.brake=0; });
function applyKeys(){
  if(touchOnly) return;
  ctl.left =(K.ArrowLeft||K.KeyA)?1:0;
  ctl.right=(K.ArrowRight||K.KeyD)?1:0;
  ctl.gas  =(K.ArrowUp||K.KeyW||K.KeyZ)?1:0;
  ctl.brake=(K.ArrowDown||K.KeyS||K.KeyX)?1:0;
}
const zSteer=document.getElementById('zSteer'), zPedal=document.getElementById('zPedal');
const padhint=document.getElementById('padhint');
let st={id:null,x0:0}, pd={id:null,y0:0};
function bindTouch(){
  zSteer.addEventListener('touchstart',e=>{
    e.preventDefault(); touchOnly=true; ac();
    const t=e.changedTouches[0];
    if(st.id===null){ st.id=t.identifier; st.x0=t.clientX; }
    if(state!=='drive') anyTap();
  },{passive:false});
  zSteer.addEventListener('touchmove',e=>{
    e.preventDefault();
    for(const t of e.changedTouches){ if(t.identifier!==st.id) continue;
      const dx=t.clientX-st.x0;
      ctl.left = dx<-10?1:0; ctl.right= dx>10?1:0;
    }
  },{passive:false});
  const sEnd=e=>{ e.preventDefault();
    for(const t of e.changedTouches) if(t.identifier===st.id){ st.id=null; ctl.left=ctl.right=0; } };
  zSteer.addEventListener('touchend',sEnd,{passive:false});
  zSteer.addEventListener('touchcancel',sEnd,{passive:false});

  zPedal.addEventListener('touchstart',e=>{
    e.preventDefault(); touchOnly=true; ac();
    const t=e.changedTouches[0];
    if(pd.id===null){ pd.id=t.identifier; pd.y0=t.clientY; ctl.gas=1; ctl.brake=0; }
    if(state!=='drive') anyTap();
  },{passive:false});
  zPedal.addEventListener('touchmove',e=>{
    e.preventDefault();
    for(const t of e.changedTouches){ if(t.identifier!==pd.id) continue;
      const dy=t.clientY-pd.y0;
      if(dy>34){ ctl.brake=1; ctl.gas=0; } else { ctl.brake=0; ctl.gas=1; }
    }
  },{passive:false});
  const pEnd=e=>{ e.preventDefault();
    for(const t of e.changedTouches) if(t.identifier===pd.id){ pd.id=null; ctl.gas=0; ctl.brake=0; } };
  zPedal.addEventListener('touchend',pEnd,{passive:false});
  zPedal.addEventListener('touchcancel',pEnd,{passive:false});
}
bindTouch();

/* ---------------- update ---------------- */
function findSeg(z){ return segs[Math.floor(z/SEG)%segs.length]; }

function update(dt){
  perf+=dt*1000;
  if(inputLock>0) inputLock-=dt;
  if(msgT>0) msgT-=dt;
  if(bumpT>0) bumpT-=dt;
  if(skidT>0) skidT-=dt;
  if(crashT>0) crashT-=dt;
  if(dirtT>0) dirtT-=dt;
  for(let i=smoke.length-1;i>=0;i--){
    const s=smoke[i]; s.t-=dt; s.x+=s.vx*dt; s.y+=s.vy*dt; s.r+=26*dt;
    if(s.t<=0) smoke.splice(i,1);
  }
  applyKeys();

  if(state==='ready'){ phaseT+=dt; engineSet(0.2,true);
    if(phaseT>1.8){ state='drive'; } return; }
  if(state!=='drive'){ phaseT+=dt; return; }
  if(paused) return;

  const seg=findSeg(pos);
  const maxs = gearHi? MAXSPD : MAXSPD*0.62;
  /* pedals */
  if(ctl.gas)        speed += (gearHi? 3400:5200)*dt;
  else if(ctl.brake) speed -= 9000*dt;
  else               speed -= 1400*dt;
  if(speed>maxs) speed -= 3000*dt;
  speed=clamp(speed,0,MAXSPD*1.02);

  /* steering, and the road pulling you outwards on a bend */
  const sp=speed/MAXSPD;
  const steer=(ctl.right?1:0)-(ctl.left?1:0);
  /* a fresh hit costs you some of your steering for a moment — that is what
     makes a crash feel like a crash rather than an invisible brake */
  const grip=crashT>0? 0.45+0.55*(1-Math.min(1,crashT/0.7)) : 1;
  playerX += steer*dt*2.4*sp*grip;
  playerX -= seg.curve*dt*sp*sp*0.55;
  /* the slew after a hit pushes you toward the verge, but it stops at the
     edge — one clip should not fling you into the sand on its own */
  if(crashT>0 && Math.abs(playerX)<0.88) playerX += crashDir*dt*1.05*Math.min(1,crashT/0.7);
  playerX=clamp(playerX,-2.6,2.6);

  /* Off-road, fork-aware. While the road is split the tarmac is two ribbons
     around a central island, so the middle counts as off-road too — without
     this the car braked in the gap for no visible reason. */
  const fk=seg.fork||0;
  if(fk>0.02){
    const side=playerX>=0?1:-1;
    offRoad=Math.abs(playerX-side*forkOff(fk))>forkHW(fk)+0.06;
  }else{
    offRoad=Math.abs(playerX)>1.02;
  }
  if(offRoad){
    if(speed>MAXSPD*0.42){ speed-=MAXSPD*0.75*dt; if(skidT<=0){ sfx.skid(); skidT=0.3; } }
    else speed=Math.min(speed,MAXSPD*0.42);
    if(dirtT<=0 && speed>MAXSPD*0.3){ say(T('dirt')); dirtT=1.6; }
  }

  /* Traffic. The contact box is now the width the car is actually drawn
     (±0.15 of the road half-width plus a little), not half the road, and a
     hit drops you to the pace of the car you hit instead of to a standstill. */
  for(const c of cars){
    c.z+=c.speed*dt;
    if(c.z>segs.length*SEG) c.z-=segs.length*SEG;
    if(c.brake>0) c.brake-=dt;
    const cseg=findSeg(c.z);
    const cx=carX(c,(cseg&&cseg.fork)||0);
    const dz=c.z-pos;
    const near=(dz>-SEG*0.5 && dz<SEG*1.5);
    if(near && crashT<=0.5 && Math.abs(cx-playerX)<0.34 && speed>c.speed*0.9){
      speed=Math.max(c.speed*0.82, speed*0.45);
      crashDir = (playerX>=cx? 1:-1);
      crashT=0.85;
      playerX += crashDir*0.12;
      spawnSmoke();
      if(bumpT<=0){ sfx.bump(); bumpT=0.6; say(T('bump')); }
    }else if(dz>0 && dz<SEG*7 && Math.abs(cx-playerX)<0.34 && speed>c.speed*1.05){
      /* you are closing on it — light up its brake lights as a warning */
      c.brake=0.2;
    }
  }

  pos+=speed*dt;
  distance+=speed*dt;
  score+=Math.floor(speed*dt*0.02);
  timeLeft-=dt;
  engineSet(0.2+sp*(gearHi?1.4:0.9), true);

  if(timeLeft<=0){ timeLeft=0; timeUp(); return; }

  /* which side of the fork are you on when the split ends */
  if(segs[Math.floor(pos/SEG)] && segs[Math.floor(pos/SEG)].fork>0.2 && Math.abs(playerX)>0.15)
    forkChoice = playerX>0? 1:0;

  if(pos>=trackLen-SEG*3){ nextStage(); }
}

/* ---------------- projection ---------------- */
function project(p,camX,camY,camZ,w,h){
  p.camera={x:(p.world.x||0)-camX, y:p.world.y-camY, z:p.world.z-camZ};
  if(p.camera.z<1) p.camera.z=1;
  p.screen={};
  p.screen.scale=CAMD/p.camera.z;
  p.screen.x=Math.round(w/2 + p.screen.scale*p.camera.x*w/2);
  p.screen.y=Math.round(h/2 - p.screen.scale*p.camera.y*h/2);
  p.screen.w=Math.round(p.screen.scale*ROADW*w/2);
}
function poly(x1,y1,w1,x2,y2,w2,col){
  X.fillStyle=col;
  X.beginPath();
  X.moveTo(x1-w1,y1); X.lineTo(x2-w2,y2); X.lineTo(x2+w2,y2); X.lineTo(x1+w1,y1);
  X.closePath(); X.fill();
}
function drawRoad(){
  const base=Math.floor(pos/SEG), camY=CAMH+(findSeg(pos)?findSeg(pos).p1.world.y:0);
  let x=0, dx=0, maxY=H;
  /* sky */
  const g=X.createLinearGradient(0,0,0,H*0.62);
  g.addColorStop(0,theme.sky[0]); g.addColorStop(1,theme.sky[1]);
  X.fillStyle=g; X.fillRect(0,0,W,H);
  /* sun */
  X.fillStyle='rgba(255,240,180,.55)';
  X.beginPath(); X.arc(W*0.72, H*0.30, 46, 0, TAU); X.fill();
  /* ground */
  X.fillStyle=theme.ground; X.fillRect(0,H*0.42,W,H*0.58);

  const drawn=[];
  for(let n=0;n<DRAW;n++){
    const s=segs[(base+n)%segs.length];
    const loop=(base+n)>=segs.length? segs.length*SEG:0;
    s.looped=loop;
    project(s.p1, playerX*ROADW - x,       camY, pos-loop, W, H);
    project(s.p2, playerX*ROADW - x - dx,  camY, pos-loop, W, H);
    x+=dx; dx+=s.curve;
    if(s.p2.screen.y>=maxY || s.p1.camera.z<=1) continue;
    maxY=s.p2.screen.y;

    const dark=Math.floor((base+n)/3)%2===0;
    const grass = dark? theme.ground : shade(theme.ground,10);
    const road  = dark? theme.road   : shade(theme.road,8);
    const rum   = dark? theme.rumble[0] : theme.rumble[1];

    const p1=s.p1.screen, p2=s.p2.screen;
    X.fillStyle=grass; X.fillRect(0,p2.y,W,p1.y-p2.y+1);
    if(s.fork>0){
      /* Two carriageways peeling apart around an island. The island is drawn
         from the inner edges of the two roads, so it grows out of the tarmac
         as a wedge instead of the road simply going see-through. */
      const f=s.fork;
      const off=forkOff(f)*p1.w, off2=forkOff(f)*p2.w;
      const hw1=forkHW(f)*p1.w,  hw2=forkHW(f)*p2.w;
      /* Both rumbles first, then both carriageways: while the two roads still
         overlap the tarmac hides the inner kerbs, so the split grows out of
         one road instead of a red stripe appearing down the middle of it. */
      poly(p1.x-off,p1.y,hw1*1.12,p2.x-off2,p2.y,hw2*1.12,rum);
      poly(p1.x+off,p1.y,hw1*1.12,p2.x+off2,p2.y,hw2*1.12,rum);
      poly(p1.x-off,p1.y,hw1,p2.x-off2,p2.y,hw2,road);
      poly(p1.x+off,p1.y,hw1,p2.x+off2,p2.y,hw2,road);
      /* a centre line on each carriageway once they read as separate roads */
      if(dark && f>0.45){
        poly(p1.x-off,p1.y,hw1*0.03,p2.x-off2,p2.y,hw2*0.03,'#e8e8f0');
        poly(p1.x+off,p1.y,hw1*0.03,p2.x+off2,p2.y,hw2*0.03,'#e8e8f0');
      }
      /* the island, drawn from the inner kerbs once they have actually parted */
      const gR1=p1.x+off-hw1*1.12, gL1=p1.x-off+hw1*1.12;
      const gR2=p2.x+off2-hw2*1.12, gL2=p2.x-off2+hw2*1.12;
      if(gR1>gL1+1 && gR2>gL2+1){
        const c1=(gL1+gR1)/2, w1=(gR1-gL1)/2;
        const c2=(gL2+gR2)/2, w2=(gR2-gL2)/2;
        poly(c1,p1.y,w1,c2,p2.y,w2,grass);
      }
    }else{
      poly(p1.x,p1.y,p1.w*1.12,p2.x,p2.y,p2.w*1.12,rum);
      poly(p1.x,p1.y,p1.w,p2.x,p2.y,p2.w,road);
      if(dark){
        for(let l=1;l<LANES;l++){
          const lx1=p1.x-p1.w+(p1.w*2)*l/LANES, lx2=p2.x-p2.w+(p2.w*2)*l/LANES;
          poly(lx1,p1.y,p1.w*0.02,lx2,p2.y,p2.w*0.02,'#e8e8f0');
        }
      }
    }
    drawn.push(s);
  }
  /* sprites and cars, far to near */
  for(let n=drawn.length-1;n>=0;n--){
    const s=drawn[n];
    for(const sp of s.sprites) drawSprite(s,sp.x,sp.kind);
    for(const c of cars){
      const idx=Math.floor(c.z/SEG)%segs.length;
      if(idx===s.i) drawCar(s,c);
    }
  }
}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  const r=clamp((n>>16)+amt,0,255), g=clamp(((n>>8)&255)+amt,0,255), b=clamp((n&255)+amt,0,255);
  return 'rgb('+(r|0)+','+(g|0)+','+(b|0)+')';
}
function drawSprite(s,offX,kind){
  const p=s.p1.screen;
  if(!p||p.scale<=0||!p.w) return;
  /* Size everything against the projected road half-width. Deriving it from
     the raw scale instead silently shrank every palm to under a pixel. */
  const x=p.x+p.w*offX, y=p.y;
  const hgt=p.w*(kind==='sign'?0.42:(kind==='split'?0.60:0.95));
  if(hgt<1.5||hgt>H*3) return;
  if(kind==='split'){
    /* chevron board on the nose of the island, with the two arrows */
    const bw=hgt*1.5, bh=hgt*0.42, by=y-hgt;
    X.fillStyle='#6a6a72'; X.fillRect(x-hgt*0.03,by+bh,hgt*0.06,hgt-bh);
    X.fillStyle='#181820'; X.fillRect(x-bw/2-2,by-2,bw+4,bh+4);
    X.fillStyle='#ffd23b'; X.fillRect(x-bw/2,by,bw,bh);
    X.fillStyle='#181820';
    const n=Math.max(3,Math.round(bw/(bh*0.55)));
    for(let i=0;i<n;i++){
      const cx=x-bw/2+bw*(i+0.5)/n, d=bh*0.30;
      const s2=i<n/2?-1:1;
      X.beginPath();
      X.moveTo(cx-d*s2,by+bh*0.16); X.lineTo(cx+d*s2,by+bh*0.5);
      X.lineTo(cx-d*s2,by+bh*0.84); X.lineTo(cx-d*s2*0.35,by+bh*0.84);
      X.lineTo(cx+d*s2*0.45,by+bh*0.5); X.lineTo(cx-d*s2*0.35,by+bh*0.16);
      X.closePath(); X.fill();
    }
    return;
  }
  if(kind==='palm'){
    X.fillStyle='#6a4a28'; X.fillRect(x-hgt*0.05,y-hgt,hgt*0.10,hgt);
    X.fillStyle='#2f7a3a';
    for(let i=0;i<5;i++){
      const a=-Math.PI/2+(i-2)*0.55;
      X.beginPath(); X.moveTo(x,y-hgt);
      X.lineTo(x+Math.cos(a)*hgt*0.42, y-hgt+Math.sin(a)*hgt*0.34);
      X.lineTo(x+Math.cos(a)*hgt*0.30, y-hgt+Math.sin(a)*hgt*0.10);
      X.closePath(); X.fill();
    }
  }else if(kind==='tree'||kind==='pine'){
    X.fillStyle='#5a3a20'; X.fillRect(x-hgt*0.05,y-hgt*0.4,hgt*0.10,hgt*0.4);
    X.fillStyle=kind==='pine'?'#1f5a34':'#2f7a3a';
    if(kind==='pine'){ X.beginPath(); X.moveTo(x,y-hgt); X.lineTo(x+hgt*0.28,y-hgt*0.32);
      X.lineTo(x-hgt*0.28,y-hgt*0.32); X.closePath(); X.fill(); }
    else { X.beginPath(); X.arc(x,y-hgt*0.62,hgt*0.32,0,TAU); X.fill(); }
  }else if(kind==='cactus'){
    X.fillStyle='#3f8a4a';
    X.fillRect(x-hgt*0.07,y-hgt*0.8,hgt*0.14,hgt*0.8);
    X.fillRect(x-hgt*0.26,y-hgt*0.56,hgt*0.19,hgt*0.08);
    X.fillRect(x+hgt*0.07,y-hgt*0.66,hgt*0.19,hgt*0.08);
  }else if(kind==='lamp'){
    X.fillStyle='#8a8a96'; X.fillRect(x-hgt*0.03,y-hgt,hgt*0.06,hgt);
    X.fillStyle='#ffe6a0'; X.beginPath(); X.arc(x,y-hgt,hgt*0.10,0,TAU); X.fill();
  }else{
    X.fillStyle='#d8d0b0'; X.fillRect(x-hgt*0.55,y-hgt*1.1,hgt*1.1,hgt*0.62);
    X.fillStyle='#3a4a99'; X.fillRect(x-hgt*0.45,y-hgt*1.0,hgt*0.9,hgt*0.42);
    X.fillStyle='#8a8a96'; X.fillRect(x-hgt*0.04,y-hgt*0.5,hgt*0.08,hgt*0.5);
  }
}
function drawCar(s,c){
  const p=s.p1.screen; if(!p||p.scale<=0||!p.w) return;
  const wdt=p.w*0.30, hgt=wdt*0.62;
  if(wdt<2||wdt>W*1.6) return;
  const x=p.x+p.w*carX(c,s.fork||0), y=p.y;
  X.fillStyle='rgba(0,0,0,.3)';
  X.beginPath(); X.ellipse(x,y,wdt*0.6,hgt*0.22,0,0,TAU); X.fill();
  X.fillStyle=c.col; X.fillRect(x-wdt/2,y-hgt,wdt,hgt*0.78);
  X.fillStyle=shade(c.col,-40); X.fillRect(x-wdt*0.34,y-hgt*1.24,wdt*0.68,hgt*0.42);
  X.fillStyle='#2a2a30';
  X.fillRect(x-wdt*0.54,y-hgt*0.3,wdt*0.16,hgt*0.34);
  X.fillRect(x+wdt*0.38,y-hgt*0.3,wdt*0.16,hgt*0.34);
  /* brake lights: dull normally, bright while you are closing on this car,
     which is the warning that used to be missing entirely */
  X.fillStyle=c.brake>0? '#ff2a10':'#ff6a4a';
  X.fillRect(x-wdt*0.42,y-hgt*0.66,wdt*0.16,hgt*0.16);
  X.fillRect(x+wdt*0.26,y-hgt*0.66,wdt*0.16,hgt*0.16);
  if(c.brake>0 && wdt>10){
    X.fillStyle='rgba(255,60,30,.28)';
    X.beginPath(); X.arc(x-wdt*0.34,y-hgt*0.58,wdt*0.22,0,TAU); X.fill();
    X.beginPath(); X.arc(x+wdt*0.34,y-hgt*0.58,wdt*0.22,0,TAU); X.fill();
  }
}
function drawPlayerCar(){
  const cw=crashT>0? Math.min(1,crashT/0.85) : 0;
  const bob=Math.sin(perf/90)*(speed/MAXSPD)*1.6 + (bumpT>0?Math.sin(perf/22)*3:0)
            + (cw?Math.sin(perf/18)*5*cw:0);
  const x=W/2 + (ctl.left?-6:0) + (ctl.right?6:0)
          + (cw? Math.sin(perf/26)*22*cw*crashDir : 0);
  const y=H-58+bob;
  const w=132, h=44;
  /* tyre smoke sits behind the car, at wheel height */
  for(const s of smoke){
    X.fillStyle='rgba(228,224,220,'+(0.40*Math.max(0,s.t)).toFixed(3)+')';
    X.beginPath(); X.arc(W/2+s.x, H-30+s.y, s.r, 0, TAU); X.fill();
  }
  /* the car slews after a hit — you can see what happened to you */
  X.save();
  if(cw){ X.translate(x,y); X.rotate(Math.sin(perf/24)*0.10*cw*crashDir); X.translate(-x,-y); }
  X.fillStyle='rgba(0,0,0,.35)';
  X.beginPath(); X.ellipse(x,y+22,w*0.52,9,0,0,TAU); X.fill();
  /* body */
  X.fillStyle='#d02a2a'; X.fillRect(x-w/2,y-h*0.55,w,h*0.85);
  X.fillStyle='#a01a1a'; X.fillRect(x-w/2,y+h*0.16,w,h*0.16);
  /* cabin + driver */
  X.fillStyle='#8a1414'; X.fillRect(x-w*0.30,y-h*0.98,w*0.60,h*0.46);
  X.fillStyle='#2a2a36'; X.fillRect(x-w*0.26,y-h*0.92,w*0.52,h*0.32);
  X.fillStyle='#e8b088'; X.beginPath(); X.arc(x-w*0.10,y-h*0.86,6,0,TAU); X.fill();
  X.fillStyle='#f0e0c0'; X.beginPath(); X.arc(x+w*0.10,y-h*0.86,6,0,TAU); X.fill();
  /* wheels */
  X.fillStyle='#181820';
  X.fillRect(x-w*0.52,y-h*0.1,w*0.12,h*0.52);
  X.fillRect(x+w*0.40,y-h*0.1,w*0.12,h*0.52);
  /* lights */
  X.fillStyle='#ff8a4a';
  X.fillRect(x-w*0.44,y-h*0.34,w*0.14,h*0.16);
  X.fillRect(x+w*0.30,y-h*0.34,w*0.14,h*0.16);
  if(offRoad && speed>MAXSPD*0.2 && Math.floor(perf/60)%2===0){
    X.fillStyle='rgba(220,200,150,.6)';
    for(let i=0;i<5;i++) X.beginPath(),
      X.arc(x-w*0.5+Math.random()*w, y+18+Math.random()*10, 3+Math.random()*4,0,TAU), X.fill();
  }
  X.restore();
}

/* ---------------- HUD ---------------- */
function drawHUD(){
  shadowText(T('time'),40,20,11,'#ffd9a0');
  shadowText(String(Math.ceil(timeLeft)).padStart(3,'0'),40,44,30,'#ffffff');
  shadowText(T('score'),W/2,16,10,'#ffd9a0');
  shadowText(String(score).padStart(7,'0'),W/2,34,18,'#ffffff');
  shadowText(T('speed'),W-46,16,10,'#ffd9a0');
  shadowText(String(Math.round(speed/MAXSPD*293)).padStart(3,'0'),W-46,38,24,'#ffffff');
  shadowText(T('stage')+' '+(stageRow+1)+'/'+ROWS,W-46,60,10,'#ffd9a0');
  shadowText(gearHi?T('high'):T('lo'),56,72,14,gearHi?'#ff8a4a':'#8ad0e0');
  /* radio strip */
  shadowText('♫ '+TUNES[radio].name,W/2,H-14,10,'rgba(255,217,160,.75)');
  if(msgT>0) shadowText(msg,W/2,120,22,'#ffd23b');
}

/* ---------------- render ---------------- */
function render(){
  if(state==='title'){ drawTitle(); return; }
  if(state==='radio'){ drawRadio(); return; }
  /* a short shake on impact — the world moves, not just the number */
  const shake = crashT>0? Math.min(1,crashT/0.85) : 0;
  X.save();
  if(shake) X.translate(Math.sin(perf/13)*7*shake, Math.cos(perf/11)*4*shake);
  drawRoad();
  drawPlayerCar();
  X.restore();
  drawHUD();
  if(state==='ready'){
    dim(0.34);
    shadowText(theme.name+'  —  '+T('stage')+' '+(stageRow+1),W/2,H/2-24,24,'#ffd9a0');
    if(phaseT>1.1) shadowText(T('go'),W/2,H/2+22,32,'#8ef0a0');
  }
  if(state==='drive' && segs[Math.floor(pos/SEG)] && segs[Math.floor(pos/SEG)].fork>0.04
     && stageRow<ROWS-1){
    shadowText(T('fork'),W/2,150,20,'#ffd23b');
    /* which way each side takes you, so the choice is not blind */
    const blink=Math.floor(perf/380)%2===0;
    shadowText('◀ '+T('keepleft'), W/2-118,176,14, blink?'#ffffff':'#ffd23b');
    shadowText(T('keepright')+' ▶',W/2+118,176,14, blink?'#ffd23b':'#ffffff');
  }
  if(paused){ dim(0.5); shadowText(T('pause'),W/2,H/2,28,'#ffd23b'); }
  if(state==='over'){ dim(0.62); drawEnd(T('timeup'),'#ff5a3a'); }
  if(state==='goal'){ dim(0.62); drawEnd(T('goal'),'#ffd23b'); }
}
function dim(a){ X.fillStyle='rgba(0,0,0,'+a+')'; X.fillRect(0,0,W,H); }
function drawEnd(title,col){
  shadowText(title,W/2,86,38,col);
  if(state==='goal') shadowText(T('finish')+'  '+endGoal,W/2,122,18,'#ffffff');
  shadowText((playerName||'???')+' — '+score,W/2,152,18,'#ffffff');
  drawBoard(184,5);
  if(sendState) shadowText(sendState,W/2,H-56,10,'#8ef0a0');
  if(Math.floor(perf/500)%2===0) shadowText(T('again'),W/2,H-28,14,'#ffd9a0');
}
function drawBoard(top,rows){
  if(boardState==='loading'){ shadowText(T('loading'),W/2,top+18,12,'#ffd9a0'); return; }
  const online=boardState==='ok'&&boardRows&&boardRows.length;
  const list=online? boardRows.slice(0,rows):localScores.slice(0,rows);
  shadowText(T('board'),W/2,top,13,'#ffb060');
  X.fillStyle='rgba(255,176,96,.3)'; X.fillRect(W/2-150,top+11,300,1);
  if(!list.length) shadowText('- - -',W/2,top+28,12,'#c8a0d8');
  list.forEach((h,i)=>{
    const y=top+28+i*18;
    shadowText(String(i+1)+'.',W/2-140,y,12,'#c8a0d8','left');
    shadowText(h.n,W/2-114,y,12,'#ffffff','left');
    shadowText(String(h.s),W/2+140,y,12,'#ffd23b','right');
  });
  if(!online) shadowText(T('offline'),W/2,top+32+rows*18,9,'#ff9f6f');
}
function drawTitle(){
  const g=X.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2a1050'); g.addColorStop(0.5,'#c04a5a'); g.addColorStop(1,'#ff9a4a');
  X.fillStyle=g; X.fillRect(0,0,W,H);
  X.fillStyle='rgba(255,240,180,.85)';
  X.beginPath(); X.arc(W/2,H*0.52,78,0,TAU); X.fill();
  X.fillStyle='rgba(42,16,80,.55)';
  for(let i=0;i<8;i++) X.fillRect(0,H*0.52+i*10, W, 4+i);
  X.fillStyle='#1a0c28'; X.fillRect(0,H*0.72,W,H*0.28);
  X.fillStyle='rgba(255,154,74,.25)';
  for(let x=-2;x<W;x+=64) X.fillRect(x,H*0.72,4,H*0.28);
  shadowText('COŠTA',W/2-96,74,46,'#ffd23b');
  shadowText('DEL SOL',W/2+94,74,46,'#ff6a4a');
  shadowText(T('sub'),W/2,112,12,'#ffd9a0');
  shadowText(T('driver')+': '+(playerName||'???'),W/2,146,14,'#ffffff');
  shadowText(T('chname'),W/2,164,9,'#c8a0d8');
  drawBoard(192,4);
  if(Math.floor(perf/500)%2===0) shadowText(T('start'),W/2,H-58,15,'#ffffff');
  shadowText(touchOnly? T('touch').split('\n')[0] : T('keys'),W/2,H-32,9.5,'#ffd9a0');
}
function drawRadio(){
  const g=X.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#2a1050'); g.addColorStop(1,'#c04a5a');
  X.fillStyle=g; X.fillRect(0,0,W,H);
  shadowText(T('radio'),W/2,58,28,'#ffd23b');
  TUNES.forEach((t,i)=>{
    const y=140+i*54, on=i===radio;
    X.fillStyle= on? 'rgba(255,210,59,.22)':'rgba(0,0,0,.28)';
    X.fillRect(W/2-190,y-22,380,44);
    if(on){ X.fillStyle='#ffd23b'; X.fillRect(W/2-190,y-22,4,44); }
    shadowText(t.name,W/2,y,18,on?'#ffd23b':'#ffd9a0');
  });
  shadowText(T('pick'),W/2,H-46,13,'#ffffff');
}

/* ---------------- score board ---------------- */
const FB_PROJECT='batty-60ebf';
const FB_KEY='AIzaSyBEB8PZHUoGdBS1olmqi_viTwKsxcb7y3o';
const FB_COL='costa_scores';
const FB_BASE='https://firestore.googleapis.com/v1/projects/'+FB_PROJECT+
              '/databases/(default)/documents';
const fbReady=()=>FB_PROJECT.indexOf('__')!==0 && !!FB_KEY;
let boardRows=null, boardState='idle', sendState='';
async function loadBoard(){
  if(!fbReady()){ boardState='offline'; return; }
  boardState='loading';
  try{
    const q={structuredQuery:{from:[{collectionId:FB_COL}],
      orderBy:[{field:{fieldPath:'score'},direction:'DESCENDING'}],limit:10}};
    const r=await fetch(FB_BASE+':runQuery?key='+FB_KEY,{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(q),cache:'no-store'});
    if(!r.ok) throw 0;
    const d=await r.json();
    boardRows=d.filter(x=>x.document).map(x=>{
      const f=x.document.fields||{};
      return {n:((f.name&&f.name.stringValue)||'?').toUpperCase().slice(0,12),
              s:parseInt((f.score&&f.score.integerValue)||0,10)||0,
              l:parseInt((f.level&&f.level.integerValue)||0,10)||0};});
    boardState='ok';
  }catch(e){ boardState='error'; boardRows=null; }
}
async function submitOnline(name,sc,lv){
  if(!fbReady()) return false;
  try{
    const body={fields:{
      name:{stringValue:(name||'???').slice(0,12)},
      score:{integerValue:String(sc|0)},
      level:{integerValue:String(lv|0)},
      created:{timestampValue:new Date().toISOString()}}};
    const r=await fetch(FB_BASE+'/'+FB_COL+'?key='+FB_KEY,{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    return r.ok;
  }catch(e){ return false; }
}
function submitScore(){
  localScores.push({n:playerName||'???', s:score, l:stageRow+1});
  localScores.sort((a,b)=>b.s-a.s); localScores=localScores.slice(0,10);
  safeLS('costa_scores',JSON.stringify(localScores));
  if(score>hi){ hi=score; safeLS('costa_hi',String(hi)); }
  sendState=T('sending');
  submitOnline(playerName,score,stageRow+1).then(ok=>{
    sendState= ok? T('sent'):T('failed');
    if(ok) loadBoard();
  });
}

/* ---------------- name entry & chrome ---------------- */
const ov=document.getElementById('ov'), nmInput=document.getElementById('nm'),
      okb=document.getElementById('okb'), skb=document.getElementById('skb');
function openName(){
  overlayOpen=true; ov.style.display='flex';
  document.getElementById('ovt').textContent=T('name');
  document.getElementById('ovs').textContent=T('namehint');
  nmInput.value=playerName;
  setTimeout(()=>{ try{ nmInput.focus(); nmInput.select(); }catch(e){} },50);
}
function closeName(save){
  if(save){
    const nm=(nmInput.value||'').trim().toUpperCase()
      .replace(/[^\p{L}\p{N} .'\-_]/gu,'').replace(/\s+/g,' ').slice(0,12).trim();
    if(nm){ playerName=nm; safeLS('costa_name',nm); }
  }
  overlayOpen=false; ov.style.display='none';
}
okb.addEventListener('click',e=>{e.preventDefault(); closeName(true); sfx.menu();});
skb.addEventListener('click',e=>{e.preventDefault(); closeName(false);});
nmInput.addEventListener('keydown',e=>{ e.stopPropagation();
  if(e.key==='Enter'){ e.preventDefault(); closeName(true); }
  if(e.key==='Escape'){ e.preventDefault(); closeName(false); } });
nmInput.addEventListener('keyup',e=>e.stopPropagation());

const tb=document.getElementById('tb');
const muteBtn=document.getElementById('muteBtn'), langBtn=document.getElementById('langBtn'),
      nameBtn=document.getElementById('nameBtn');
function syncChrome(){
  langBtn.textContent=lang.toUpperCase();
  muteBtn.textContent=muted?'♪̸':'♪';
  padhint.textContent=T('touch');
  const rot=document.querySelector('#rotate span');
  if(rot) rot.textContent='↻  '+T('rotate');
  try{ document.documentElement.lang=lang; }catch(e){}
}
function cycleLang(){
  lang=LANGS[(LANGS.indexOf(lang)+1)%LANGS.length];
  safeLS('costa_lang',lang); syncChrome(); sfx.menu();
}
muteBtn.addEventListener('click',e=>{e.preventDefault(); ac(); toggleMute();});
langBtn.addEventListener('click',e=>{e.preventDefault(); ac(); cycleLang();});
nameBtn.addEventListener('click',e=>{e.preventDefault(); ac(); openName();});

function hotKey(e){
  const k=e.key;
  if(k==='m'||k==='M'){ toggleMute(); return; }
  if(state==='title'||state==='over'||state==='goal'){
    if(k==='l'||k==='L'){ cycleLang(); return; }
    if(k==='n'||k==='N'){ openName(); return; }
  }
  if(state==='radio'){
    if(e.code==='ArrowLeft'){ radio=(radio+TUNES.length-1)%TUNES.length; sfx.menu(); return; }
    if(e.code==='ArrowRight'){ radio=(radio+1)%TUNES.length; sfx.menu(); return; }
  }
  if(k==='p'||k==='P'){ if(state==='drive') paused=!paused; return; }
  if(e.code==='Space'&&state==='drive'){ gearHi=!gearHi; sfx.gear(); return; }
  if(k==='Enter'||k===' ') anyTap();
}
function anyTap(){
  if(inputLock>0||overlayOpen) return;
  ac();
  if(state==='title'){ if(!playerName){ openName(); return; } state='radio'; inputLock=0.35; return; }
  if(state==='radio'){ startRun(); inputLock=0.35; return; }
  if(state==='over'||state==='goal'){ state='title'; inputLock=0.35; loadBoard(); return; }
}

/* ---------------- loop ---------------- */
function frame(ts){
  requestAnimationFrame(frame);
  if(!last) last=ts;
  let dt=(ts-last)/1000; last=ts;
  if(dt>0.05) dt=0.05;
  const N2=2, h=dt/N2;
  for(let i=0;i<N2;i++) update(h);
  render();
  const showChrome=(state==='title'||state==='radio'||state==='over'||state==='goal'||paused);
  tb.style.display=showChrome?'flex':'none';
  padhint.classList.toggle('on', touchOnly && (state==='title'||state==='ready'));
}
syncChrome();
loadBoard();
requestAnimationFrame(frame);

/* test hook */
window.__game={
  startRun,nextStage,buildStage,timeUp,
  get state(){return state;}, set state(v){state=v;},
  get pos(){return pos;}, set pos(v){pos=v;},
  get playerX(){return playerX;}, set playerX(v){playerX=v;},
  get speed(){return speed;}, set speed(v){speed=v;},
  get timeLeft(){return timeLeft;}, set timeLeft(v){timeLeft=v;},
  get score(){return score;}, get stageRow(){return stageRow;}, get stagePos(){return stagePos;},
  get gearHi(){return gearHi;}, get trackLen(){return trackLen;}, get segs(){return segs;},
  get cars(){return cars;}, get radio(){return radio;}, set radio(v){radio=v;},
  get boardState(){return boardState;}, get touchOnly(){return touchOnly;},
  get endGoal(){return endGoal;}, get offRoad(){return offRoad;},
  get crashT(){return crashT;}, get forkAt(){return forkAt;}, get forkChoice(){return forkChoice;},
  get segFork(){const s=segs[Math.floor(pos/SEG)]; return s? s.fork:0;}, carX,
  get lang(){return lang;}, setLang:l=>{lang=l;syncChrome();},
  ctl, T, TUNES, GOALS
};
